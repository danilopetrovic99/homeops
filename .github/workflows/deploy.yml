name: Deploy

# Called by release.yml after publishing images.
# Run manually (Actions -> Deploy -> Run workflow) with an older tag to roll back.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-homelab
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, homelab]
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

      - name: Deploy stack
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

      - name: Wait for healthy app
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health >/dev/null; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          echo "app did not become healthy" >&2
          docker compose -f docker-compose.prod.yml logs --tail 50 backend || true
          exit 1

      - name: Prune old images
        if: success()
        shell: bash
        run: docker image prune -f
